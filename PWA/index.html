<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Discipline Dashboard - Track daily habits">
    <title>Drop - Discipline Dashboard</title>
    <link rel="manifest" href="manifest.json">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Screen System */
        .screen {
            display: none;
            padding: 20px;
            min-height: calc(100vh - 80px);
        }

        .screen.active {
            display: block;
        }

        /* Header */
        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date {
            font-size: 12px;
            color: #888888;
            margin-top: 4px;
        }

        /* Domain Cards */
        .domain-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #333333;
        }

        .domain-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .domain-header h2 {
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .domain-score {
            font-size: 16px;
            font-weight: bold;
            color: #888888;
        }

        /* Practices */
        .practices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .practice {
            display: flex;
            align-items: center;
            cursor: pointer;
            min-height: 44px;
            padding: 8px 0;
        }

        .practice input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: #00ff00;
        }

        .practice span {
            font-size: 16px;
            user-select: none;
        }

        .practice input:checked + span {
            color: #00ff00;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-top: 1px solid #333333;
            display: flex;
            height: 80px;
        }

        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: #888888;
            cursor: pointer;
            font-size: 12px;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-btn span:first-child {
            font-size: 20px;
        }

        .nav-btn.active {
            color: #ffffff;
        }

        .nav-btn:hover {
            color: #ffffff;
        }

        /* Placeholder Content */
        .placeholder {
            text-align: center;
            color: #888888;
            font-size: 16px;
            margin-top: 40px;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .screen {
                max-width: 400px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <!-- Today Screen -->
    <div id="screen-today" class="screen screen-today active">
        <header class="header">
            <h1>TODAY</h1>
            <div class="date">SEP 24</div>
        </header>
        
        <main class="main">
            <!-- Sleep Domain -->
            <div class="domain-card sleep">
                <div class="domain-header">
                    <h2>SLEEP</h2>
                    <div class="domain-score">0/2</div>
                </div>
                <div class="practices">
                    <label class="practice">
                        <input type="checkbox" data-domain="sleep" data-aspect="wake">
                        <span>Wake</span>
                    </label>
                    <label class="practice">
                        <input type="checkbox" data-domain="sleep" data-aspect="rest">
                        <span>Rest</span>
                    </label>
                </div>
            </div>

            <!-- Fitness Domain -->
            <div class="domain-card fitness">
                <div class="domain-header">
                    <h2>FITNESS</h2>
                    <div class="domain-score">0/3</div>
                </div>
                <div class="practices">
                    <label class="practice">
                        <input type="checkbox" data-domain="fitness" data-aspect="run">
                        <span>Run</span>
                    </label>
                    <label class="practice">
                        <input type="checkbox" data-domain="fitness" data-aspect="strength">
                        <span>Strength</span>
                    </label>
                    <label class="practice">
                        <input type="checkbox" data-domain="fitness" data-aspect="skill">
                        <span>Skill</span>
                    </label>
                </div>
            </div>

            <!-- Mind Domain -->
            <div class="domain-card mind">
                <div class="domain-header">
                    <h2>MIND</h2>
                    <div class="domain-score">0/2</div>
                </div>
                <div class="practices">
                    <label class="practice">
                        <input type="checkbox" data-domain="mind" data-aspect="read">
                        <span>Read</span>
                    </label>
                    <label class="practice">
                        <input type="checkbox" data-domain="mind" data-aspect="write">
                        <span>Write</span>
                    </label>
                </div>
            </div>

            <!-- Spirit Domain -->
            <div class="domain-card spirit">
                <div class="domain-header">
                    <h2>SPIRIT</h2>
                    <div class="domain-score">0/2</div>
                </div>
                <div class="practices">
                    <label class="practice">
                        <input type="checkbox" data-domain="spirit" data-aspect="stress">
                        <span>Stress</span>
                    </label>
                    <label class="practice">
                        <input type="checkbox" data-domain="spirit" data-aspect="meditation">
                        <span>Meditation</span>
                    </label>
                </div>
            </div>
        </main>
    </div>

    <!-- Week Screen -->
    <div id="screen-week" class="screen screen-week">
        <header class="header">
            <h1>WEEK</h1>
        </header>
        <main class="main">
            <div class="placeholder">
                <p>Weekly view placeholder</p>
            </div>
        </main>
    </div>

    <!-- Settings Screen -->
    <div id="screen-settings" class="screen screen-settings">
        <header class="header">
            <h1>SETTINGS</h1>
        </header>
        <main class="main">
            <div class="placeholder">
                <p>Settings placeholder</p>
            </div>
        </main>
    </div>

    <!-- About Screen -->
    <div id="screen-about" class="screen screen-about">
        <header class="header">
            <h1>ABOUT</h1>
        </header>
        <main class="main">
            <div class="placeholder">
                <p>About placeholder</p>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-screen="today">
            <span>📝</span>
            <span>Today</span>
        </button>
        <button class="nav-btn" data-screen="week">
            <span>📊</span>
            <span>Week</span>
        </button>
        <button class="nav-btn" data-screen="settings">
            <span>⚙️</span>
            <span>Settings</span>
        </button>
        <button class="nav-btn" data-screen="about">
            <span>ℹ️</span>
            <span>About</span>
        </button>
    </nav>

    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('SW registered'))
                    .catch(() => console.log('SW registration failed'));
            });
        }

        // Practice mapping
        const PRACTICES = {
            sleep: ['wake', 'rest'],
            fitness: ['run', 'strength', 'skill'],
            mind: ['read', 'write'],
            spirit: ['stress', 'meditation']
        };

        // Current data
        let currentData = {
            date: '',
            practices: {}
        };

        // Initialize app
        function initApp() {
            updateDate();
            loadData();
            setupEventListeners();
            updateAllDomainScores();
        }

        // Set up event listeners
        function setupEventListeners() {
            // Bottom navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const screen = e.currentTarget.dataset.screen;
                    switchScreen(screen);
                });
            });

            // Practice toggles
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const domain = e.target.dataset.domain;
                    const aspect = e.target.dataset.aspect;
                    togglePractice(domain, aspect);
                });
            });
        }

        // Switch screens
        function switchScreen(screenName) {
            // Hide all screens
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });

            // Show target screen
            document.getElementById(`screen-${screenName}`).classList.add('active');

            // Update nav buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-screen="${screenName}"]`).classList.add('active');
        }

        // Toggle practice state
        function togglePractice(domain, aspect) {
            const practiceKey = `${domain}-${aspect}`;
            const checkbox = document.querySelector(`[data-domain="${domain}"][data-aspect="${aspect}"]`);
            
            currentData.practices[practiceKey] = checkbox.checked;
            
            updateDomainScore(domain);
            saveData();
        }

        // Update domain score display
        function updateDomainScore(domain) {
            const domainPractices = PRACTICES[domain];
            let completed = 0;
            
            domainPractices.forEach(aspect => {
                const practiceKey = `${domain}-${aspect}`;
                if (currentData.practices[practiceKey]) {
                    completed++;
                }
            });
            
            const total = domainPractices.length;
            const scoreElement = document.querySelector(`.domain-card.${domain} .domain-score`);
            
            if (scoreElement) {
                scoreElement.textContent = `${completed}/${total}`;
            }
        }

        // Update all domain scores
        function updateAllDomainScores() {
            Object.keys(PRACTICES).forEach(domain => {
                updateDomainScore(domain);
            });
        }

        // Save data to localStorage
        function saveData() {
            try {
                localStorage.setItem('drop-data', JSON.stringify(currentData));
            } catch (e) {
                console.log('Save failed');
            }
        }

        // Load data from localStorage
        function loadData() {
            try {
                const saved = localStorage.getItem('drop-data');
                if (saved) {
                    const data = JSON.parse(saved);
                    
                    // Check if data is from today
                    if (data.date === getTodayString()) {
                        currentData = data;
                        restoreCheckboxes();
                    } else {
                        // New day - reset data
                        initTodayData();
                    }
                } else {
                    initTodayData();
                }
            } catch (e) {
                initTodayData();
            }
        }

        // Initialize today's data
        function initTodayData() {
            currentData = {
                date: getTodayString(),
                practices: {}
            };
            
            // Initialize all practices as false
            Object.keys(PRACTICES).forEach(domain => {
                PRACTICES[domain].forEach(aspect => {
                    const practiceKey = `${domain}-${aspect}`;
                    currentData.practices[practiceKey] = false;
                });
            });
            
            saveData();
        }

        // Restore checkbox states from data
        function restoreCheckboxes() {
            Object.keys(currentData.practices).forEach(practiceKey => {
                const [domain, aspect] = practiceKey.split('-');
                const checkbox = document.querySelector(`[data-domain="${domain}"][data-aspect="${aspect}"]`);
                
                if (checkbox) {
                    checkbox.checked = currentData.practices[practiceKey];
                }
            });
        }

        // Update date display
        function updateDate() {
            const dateElement = document.querySelector('.date');
            if (dateElement) {
                const today = new Date();
                const options = { month: 'short', day: 'numeric' };
                dateElement.textContent = today.toLocaleDateString('en-US', options).toUpperCase();
            }
        }

        // Get today as string
        function getTodayString() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }

        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
