<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal PWA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header class="top-bar">
            <div id="date"></div>
            <div class="domain-scores">
                <div class="domain-score">
                    <span>Sleep</span>
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    <span id="sleep-score-top">0</span>
                </div>
                <div class="domain-score">
                    <span>Fitness</span>
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    <span id="fitness-score-top">0</span>
                </div>
                <div class="domain-score">
                    <span>Mind</span>
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    <span id="mind-score-top">0</span>
                </div>
                <div class="domain-score">
                    <span>Spirit</span>
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                    <span id="spirit-score-top">0</span>
                </div>
            </div>
        </header>

        <main class="grid">
            <div class="card" data-domain="sleep">
                <h3>Sleep</h3>
                <span id="sleep-score-card">0</span>
            </div>
            <div class="card" data-domain="fitness">
                <h3>Fitness</h3>
                <span id="fitness-score-card">0</span>
            </div>
            <div class="card" data-domain="mind">
                <h3>Mind</h3>
                <span id="mind-score-card">0</span>
            </div>
            <div class="card" data-domain="spirit">
                <h3>Spirit</h3>
                <span id="spirit-score-card">0</span>
            </div>
        </main>

        <nav class="bottom-nav">
            <button>
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <span>Goals</span>
            </button>
            <button>
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </button>
            <button>
                <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <span>Results</span>
            </button>
        </nav>
    </div>

    <div id="sleep-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close">&times;</span>
            <h2>Sleep</h2>
            <label>Wake: <input type="time" id="wake-time"></label>
            <label>Rest: <input type="time" id="rest-time"></label>
        </div>
    </div>
    <div id="fitness-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close">&times;</span>
            <h2>Fitness</h2>
            <div>
                Run: <button class="run-adjust">-</button> <span id="run-distance">10</span>km <button class="run-adjust">+</button>
            </div>
            <label>Strength: <input type="checkbox" id="strength"></label>
            <label>Skill: <input type="checkbox" id="skill"></label>
        </div>
    </div>
    <div id="mind-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close">&times;</span>
            <h2>Mind</h2>
            <label>Read: <input type="checkbox" id="read"></label>
            <label>Write: <input type="checkbox" id="write"></label>
        </div>
    </div>
    <div id="spirit-overlay" class="overlay">
        <div class="overlay-content">
            <span class="close">&times;</span>
            <h2>Spirit</h2>
            <div class="quadrant-grid">
                <div></div><div></div><div></div><div></div>
            </div>
            <label>Meditation: <input type="checkbox" id="meditation"></label>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
