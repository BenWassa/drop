<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discipline Dashboard: Domain Score Panel</title>
<style>
/* Root variables as per design system */
:root {
  --bg-main: #0a0a0a;
  --bg-card: #1a1a1a;
  --bg-active: #2a2a2a;
  --text-primary: #ffffff;
  --text-secondary: #999;
  --text-muted: #666;

  /* These specific domain colors are now *less* directly used by JS,
     but still available for general CSS if needed elsewhere.
     The JS will use hardcoded hex values now. */
  --sleep: #00b4d8;
  --fitness: #ff6b6b;
  --mind: #9b59b6;
  --spirit: #4ecdc4;

  --success: #4ade80;
  --warning: #fbbf24;
  --error: #ef4444;

  --radius: 16px;
  --radius-sm: 8px;
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Global Reset & Body Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  padding: 40px 20px;
}

/* Base styles for concept containers */
.concept-container {
  width: 100%;
  max-width: 430px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  transition: var(--transition);
  position: relative;
}
.concept-container:hover {
  box-shadow: 0 6px 15px rgba(0,0,0,0.6);
  transform: translateY(-2px);
}

h2 {
  font-size: 28px;
  font-weight: 700;
  text-transform: uppercase;
  text-align: center;
  margin-top: 0;
  margin-bottom: 25px;
  border-bottom: 2px solid var(--text-muted);
  padding-bottom: 15px;
  color: var(--text-primary);
}
h2 small {
  font-size: 16px;
  font-weight: 500;
  color: var(--text-muted);
  display: block;
  margin-top: 5px;
  text-transform: none;
}

.concept-description {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
  text-align: center;
  line-height: 1.4;
}

/* --- Quarter Reservoir Header (Global) --- */
.quarter-reservoir-header {
  width: 100%;
  max-width: 430px;
  background: var(--bg-card);
  border: 1px solid var(--bg-active);
  border-radius: var(--radius-sm);
  padding: 10px 15px;
  margin-bottom: 25px;
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}
.quarter-reservoir-header .info-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.quarter-reservoir-header .reservoir-bar-wrapper {
  height: 18px;
  border: 1px solid var(--text-muted);
  background-color: var(--bg-active);
  position: relative;
  overflow: hidden;
  border-radius: 2px;
}
.quarter-reservoir-header .reservoir-fill {
  height: 100%;
  width: 67%;
  background-color: #1e90ff; /* Fixed to initial sleep color */
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* --- Crowns --- */
.crown-icon {
  font-size: 1em;
  margin-left: 5px;
  color: gold;
}

/* --- 1) Domain Score Panel --- */
.domain-panel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.domain-panel {
  background: var(--bg-main);
  border: 1px solid var(--bg-active);
  border-radius: var(--radius-sm);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.domain-panel .domain-name {
  font-size: 16px;
  font-weight: 600;
  text-transform: uppercase;
}
.domain-panel .score {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}
.domain-panel .score-bar-wrapper {
  width: 100%;
  height: 8px;
  background-color: var(--bg-active);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.domain-panel .score-bar-fill {
  height: 100%;
  width: 0%;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  background-color: currentColor; /* Uses domain color from JS */
}
.domain-panel .score-bar-target {
  position: absolute;
  left: 80%;
  top: 0;
  width: 2px;
  height: 100%;
  background-color: var(--text-muted);
}
.domain-panel .aspects-list {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  flex-wrap: wrap;
  gap: 0 10px;
  margin-top: 5px;
}
.domain-panel .aspect-item {
  display: flex;
  align-items: center;
}
.domain-panel .aspect-item .status-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 5px;
  background-color: var(--bg-active); /* Incomplete */
}
.domain-panel .aspect-item .status-indicator.completed {
  background-color: currentColor; /* Uses domain color from JS */
}

/* Responsive adjustments */
@media (max-width: 480px) {
  body { padding: 20px 10px; gap: 30px; }
  .concept-container, .quarter-reservoir-header {
    max-width: 100%;
    padding: 15px;
  }
  h2 { font-size: 24px; margin-bottom: 20px; }
  h2 small { font-size: 14px; }
  .concept-description { font-size: 12px; }

  .quarter-reservoir-header { margin-bottom: 15px; }
  .quarter-reservoir-header .info-line { font-size: 12px; }
  .quarter-reservoir-header .reservoir-bar-wrapper { height: 15px; }

  .domain-panel .domain-name { font-size: 14px; }
  .domain-panel .score { font-size: 18px; }
  .domain-panel .aspects-list { font-size: 12px; }
}

</style>
</head>
<body>

<!-- Quarter Reservoir Header Component -->
<div id="global-quarter-reservoir" class="quarter-reservoir-header">
    <div class="info-line">
        <span id="qr-date">SEP 23</span>
        <span>Q<span id="qr-quarter-num">3</span> • <span id="qr-progress-percent">67</span>% • <span id="qr-days-left">28</span> days left</span>
    </div>
    <div class="reservoir-bar-wrapper">
        <div class="reservoir-fill" id="qr-fill" style="width: 67%;"></div>
    </div>
</div>

<!-- Concept 1: Domain Score Panel -->
<div class="concept-container">
  <h2>1. Domain Score Panel <br><small>(Performance Snapshot)</small></h2>
  <p class="concept-description">Displays current 7-day rolling scores and today's aspect completion for each domain, with crown indicators.</p>
  <div class="domain-panel-grid" id="domain-score-panel-grid">
    <!-- Panels generated by JS -->
  </div>
</div>

<script>
    // --- Global Data, Config & Utilities ---
    const DOMAINS_AND_ASPECTS = {
        sleep: { color: '#1e90ff', aspects: ['wake', 'rest'] },    // Exact hex codes
        fitness: { color: '#ff3b30', aspects: ['run', 'strength', 'skill'] },
        mind: { color: '#7c3aed', aspects: ['read', 'write'] },
        spirit: { color: '#16a34a', aspects: ['stress', 'meditation'] }
    };

    const QUARTER_LENGTH_DAYS = 90;
    const CROWN_THRESHOLD = 80;

    /**
     * Generates a random integer between min and max (inclusive).
     */
    function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /**
     * Generates mock practice entries for a given date.
     * @param {string} dateString - "YYYY-MM-DD"
     * @returns {Array} An array of mock practice entries.
     */
    function generateDailyMockData(dateString) {
        const dailyEntries = [];
        const date = new Date(dateString);

        for (const domainKey in DOMAINS_AND_ASPECTS) {
            const domain = DOMAINS_AND_ASPECTS[domainKey];
            for (const aspect of domain.aspects) {
                const completed = Math.random() > 0.3; // 70% chance of completion
                dailyEntries.push({
                    id: `${dateString}-${domainKey}-${aspect}`,
                    date: dateString,
                    domain: domainKey,
                    aspect: aspect,
                    completed: completed,
                    streak: completed ? getRandomInt(1, 15) : 0, // Simulate streak
                    mood: completed ? getRandomInt(2, 4) : getRandomInt(1, 2), // Moods still generated in data model
                    note: '',
                    timestamp: date.getTime(),
                    synced: true
                });
            }
        }
        return dailyEntries;
    }

    /**
     * Generates mock data for the last N days.
     * @param {number} numDays - Number of days to generate data for.
     * @returns {Object} An object where keys are date strings ("YYYY-MM-DD") and values are arrays of entries.
     */
    function generatePastDaysData(numDays) {
        const data = {};
        for (let i = 0; i < numDays; i++) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const dateString = d.toISOString().split('T')[0];
            data[dateString] = generateDailyMockData(dateString);
        }
        return data;
    }

    /**
     * Calculates domain scores (7-day rolling average)
     * @param {Object} allData - Object with date keys and array of entries.
     * @param {string} latestDateString - The "today" date to calculate scores up to.
     * @returns {Object} Scores for each domain.
     */
    function calculateDomainScores(allData, latestDateString) {
        const scores = {};
        const dates = Object.keys(allData).sort().filter(d => d <= latestDateString);
        const last7Dates = dates.slice(Math.max(0, dates.length - 7));

        for (const domainKey in DOMAINS_AND_ASPECTS) {
            let completedCount = 0;
            let possibleCount = 0;

            for (const date of last7Dates) {
                const dailyEntries = allData[date] || [];
                const domainEntries = dailyEntries.filter(e => e.domain === domainKey);
                completedCount += domainEntries.filter(e => e.completed).length;
                possibleCount += domainEntries.length;
            }
            scores[domainKey] = possibleCount > 0 ? Math.round((completedCount / possibleCount) * 100) : 0;
        }
        return scores;
    }

    // --- Current Data State (Simulated) ---
    let today = new Date();
    let todayString = today.toISOString().split('T')[0];
    let allHistoricalData = generatePastDaysData(QUARTER_LENGTH_DAYS); // Generate for a full quarter to get context

    // --- Quarter Reservoir Header Component ---
    function updateQuarterReservoirHeader() {
        const quarterStart = new Date(today.getFullYear(), Math.floor(today.getMonth() / 3) * 3, 1);
        const quarterEnd = new Date(today.getFullYear(), Math.floor(today.getMonth() / 3) * 3 + 3, 0);
        const totalQuarterDays = (quarterEnd.getTime() - quarterStart.getTime()) / (1000 * 60 * 60 * 24) + 1;
        const daysPassed = (today.getTime() - quarterStart.getTime()) / (1000 * 60 * 60 * 24);
        const progress = Math.min(1, daysPassed / totalQuarterDays);

        const progressPercent = Math.round(progress * 100);
        const daysLeft = Math.max(0, totalQuarterDays - Math.round(daysPassed));

        document.getElementById('qr-date').textContent = today.toLocaleString('default', { month: 'short', day: 'numeric' }).toUpperCase();
        document.getElementById('qr-quarter-num').textContent = Math.floor(today.getMonth() / 3) + 1;
        document.getElementById('qr-progress-percent').textContent = progressPercent;
        document.getElementById('qr-days-left').textContent = daysLeft;
        document.getElementById('qr-fill').style.width = `${progressPercent}%`;
    }

    // --- 1) Domain Score Panel ---
    function updateDomainScorePanel() {
        const container = document.getElementById('domain-score-panel-grid');
        container.innerHTML = ''; // Clear previous
        const domainScores = calculateDomainScores(allHistoricalData, todayString);
        const todayEntries = allHistoricalData[todayString] || [];

        for (const domainKey in DOMAINS_AND_ASPECTS) {
            // Directly use the hex color from DOMAINS_AND_ASPECTS object
            const domainColor = DOMAINS_AND_ASPECTS[domainKey].color;
            const score = domainScores[domainKey];
            const hasCrown = score >= CROWN_THRESHOLD;

            const panel = document.createElement('div');
            panel.classList.add('domain-panel', domainKey);
            panel.innerHTML = `
                <div class="domain-name" style="color: ${domainColor}">${domainKey.toUpperCase()}</div>
                <div class="score">${score}${hasCrown ? '<span class="crown-icon">👑</span>' : ''}</div>
                <div class="score-bar-wrapper">
                    <div class="score-bar-fill" style="width: ${score}%; background-color: ${domainColor};"></div>
                    <div class="score-bar-target"></div>
                </div>
                <div class="aspects-list" id="aspects-${domainKey}"></div>
            `;
            container.appendChild(panel);

            const aspectsList = panel.querySelector(`#aspects-${domainKey}`);
            DOMAINS_AND_ASPECTS[domainKey].aspects.forEach(aspect => {
                const entry = todayEntries.find(e => e.aspect === aspect);
                const isCompleted = entry ? entry.completed : false;
                const aspectItem = document.createElement('div');
                aspectItem.classList.add('aspect-item');
                // Use the domainColor directly for status indicator if completed
                aspectItem.innerHTML = `
                    <span class="status-indicator ${isCompleted ? 'completed' : ''}" style="background-color: ${isCompleted ? domainColor : 'var(--bg-active)'};"></span>
                    <span>${aspect}</span>
                `;
                aspectsList.appendChild(aspectItem);
            });
        }
    }


    // --- Initialization and Update Loop ---
    function initializeAllVisualizations() {
        updateQuarterReservoirHeader();
        updateDomainScorePanel();
    }

    // Simulate daily update for the demo
    setInterval(() => {
        // Advance "today" by one day
        today.setDate(today.getDate() + 1);
        todayString = today.toISOString().split('T')[0];

        // Generate data for the new day and add to historical data
        allHistoricalData[todayString] = generateDailyMockData(todayString);
        
        // Trim historical data to avoid excessive growth, e.g., keep last 100 days
        const sortedDates = Object.keys(allHistoricalData).sort();
        if (sortedDates.length > 100) {
            delete allHistoricalData[sortedDates[0]];
        }

        // Re-run all visualizations
        initializeAllVisualizations();
    }, 10000); // Update every 10 seconds for a "new day" simulation

    // Initial call
    initializeAllVisualizations();

</script>
</body>
</html>
