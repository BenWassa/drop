<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Drop - Daily Performance</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles/app.css" />
  <script src="config.js" defer></script>
  <script src="data.js" defer></script>
  <script src="sync.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <div class="day-counter">DAY <span id="dayCount">1</span> / 90</div>
        <div class="sync-status" id="syncStatus">
          <span class="sync-dot"></span>
          <span id="syncText">ONLINE</span>
        </div>
      </div>

      <!-- Domain Scores -->
      <div class="domain-scores" id="domainScores">
        <div class="domain-score" data-domain="sleep">
          <div class="score-circle">
            <span class="score-value" id="scoreSleep">--</span>
            <span class="crown" id="crownSleep">👑</span>
          </div>
          <div class="domain-label">SLEEP</div>
        </div>
        <div class="domain-score" data-domain="fitness">
          <div class="score-circle">
            <span class="score-value" id="scoreFitness">--</span>
            <span class="crown" id="crownFitness">👑</span>
          </div>
          <div class="domain-label">FITNESS</div>
        </div>
        <div class="domain-score" data-domain="mind">
          <div class="score-circle">
            <span class="score-value" id="scoreMind">--</span>
            <span class="crown" id="crownMind">👑</span>
          </div>
          <div class="domain-label">MIND</div>
        </div>
        <div class="domain-score" data-domain="spirit">
          <div class="score-circle">
            <span class="score-value" id="scoreSpirit">--</span>
            <span class="crown" id="crownSpirit">👑</span>
          </div>
          <div class="domain-label">SPIRIT</div>
        </div>
      </div>
    </header>

    <!-- Today Screen -->
    <div class="screen active" id="todayScreen">
      <!-- Quick Entry Aspects -->
      <div class="domain-card sleep">
        <div class="domain-header">
          <span class="domain-icon">🌙</span>
          <span class="domain-name">SLEEP</span>
          <span class="domain-status">0/2</span>
        </div>
        <div class="aspects">
          <div class="aspect-toggle" data-domain="sleep" data-aspect="wake">Wake</div>
          <div class="aspect-toggle" data-domain="sleep" data-aspect="rest">Rest</div>
        </div>
      </div>

      <div class="domain-card fitness">
        <div class="domain-header">
          <span class="domain-icon">🏃</span>
          <span class="domain-name">FITNESS</span>
          <span class="domain-status">0/3</span>
        </div>
        <div class="aspects">
          <div class="aspect-toggle" data-domain="fitness" data-aspect="run">Run</div>
          <div class="aspect-toggle" data-domain="fitness" data-aspect="strength">Strength</div>
          <div class="aspect-toggle" data-domain="fitness" data-aspect="skill">Skill</div>
        </div>
      </div>

      <div class="domain-card mind">
        <div class="domain-header">
          <span class="domain-icon">📚</span>
          <span class="domain-name">MIND</span>
          <span class="domain-status">0/2</span>
        </div>
        <div class="aspects">
          <div class="aspect-toggle" data-domain="mind" data-aspect="read">Read</div>
          <div class="aspect-toggle" data-domain="mind" data-aspect="write">Write</div>
        </div>
      </div>

      <div class="domain-card spirit">
        <div class="domain-header">
          <span class="domain-icon">🧘</span>
          <span class="domain-name">SPIRIT</span>
          <span class="domain-status">0/2</span>
        </div>
        <div class="aspects">
          <div class="aspect-toggle" data-domain="spirit" data-aspect="stress">Stress</div>
          <div class="aspect-toggle" data-domain="spirit" data-aspect="meditation">Meditation</div>
        </div>
      </div>
    </div>

    <!-- Review Screen -->
    <div class="screen" id="reviewScreen">
      <h3>WEEKLY PERFORMANCE</h3>
      <div id="weekGrid"></div>
      <h3>CURRENT STREAKS</h3>
      <div id="streaksContainer"></div>
      <div id="weeklyCompletion"></div>
    </div>

    <!-- Reflect Screen -->
    <div class="screen" id="reflectScreen">
      <h3>DAILY LOG</h3>
      <div class="mood-scale">
        <label>ENERGY LEVEL</label>
        <div class="mood-options">
          <button class="mood-btn" data-mood="1">1</button>
          <button class="mood-btn" data-mood="2">2</button>
          <button class="mood-btn" data-mood="3">3</button>
          <button class="mood-btn" data-mood="4">4</button>
          <button class="mood-btn" data-mood="5">5</button>
        </div>
      </div>
      <div class="voice-log">
        <button id="voiceLogBtn">🎤 Voice Log (Coming Soon)</button>
      </div>
    </div>

    <!-- Settings Screen -->
    <div class="screen" id="settingsScreen">
      <div class="settings-section">
        <div class="settings-title">SYNC</div>
        <div class="setting-item">
          <span>Last sync:</span>
          <span id="lastSyncTime">--</span>
        </div>
        <button id="syncNow">Sync Now</button>
      </div>

      <div class="settings-section">
        <div class="settings-title">DATA</div>
        <button id="exportCSV">Export CSV</button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="bottom-nav-item active" data-screen="today">
        <span>📅</span><div>Today</div>
      </div>
      <div class="bottom-nav-item" data-screen="review">
        <span>📊</span><div>Review</div>
      </div>
      <div class="bottom-nav-item" data-screen="reflect">
        <span>📝</span><div>Log</div>
      </div>
      <div class="bottom-nav-item" data-screen="settings">
        <span>⚙️</span><div>Settings</div>
      </div>
    </div>
  </div>
</body>
</html>
