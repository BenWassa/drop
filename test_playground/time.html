<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four Concepts for Time</title>
<style>
  /* General Body Styles */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px;
    background-color: #f8f9fa;
    color: #212529;
  }

  .concept-container {
    width: 400px;
    padding: 20px;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    background-color: #ffffff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
  }

  h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 25px;
    border-bottom: 1px solid #e9ecef;
    padding-bottom: 10px;
    font-weight: 600;
  }


  /* --- 1) Quarter Reservoir --- */
  .reservoir-container .ledger-stamp {
    font-family: 'SF Mono', 'Courier New', Courier, monospace;
    font-size: 14px;
    color: #6c757d;
    margin-bottom: 5px;
  }
  .reservoir-container .quarter-info {
    font-family: 'SF Mono', 'Courier New', Courier, monospace;
    font-size: 14px;
    color: #212529;
    margin-bottom: 20px;
  }
  .reservoir-container .quarter-reservoir-wrapper {
    height: 30px;
    border: 2px solid #212529;
    padding: 4px;
    box-sizing: border-box;
  }
  .reservoir-container .quarter-reservoir-fill {
    height: 100%;
    width: 67%; /* Represents 67% progress */
    background-color: #212529;
    transition: width 0.5s ease-in-out;
  }
  .reservoir-container .domain-scores {
    margin-top: 20px;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
  }


  /* --- 2) Orbital Rings --- */
  .orbital-container {
    position: relative;
    width: 250px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 20px auto; /* Center in its container */
  }
  .orbital-container .center-label {
    text-align: center;
    border: 1px solid #adb5bd;
    padding: 10px 15px;
    border-radius: 4px;
  }
  .orbital-container .center-label div:first-child {
      font-weight: bold;
  }
  .orbital-container .ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid #ced4da;
  }
  .orbital-container .day-ring {
    width: 150px;
    height: 150px;
    transform: rotate(270deg); /* Example starting position for 9 PM */
  }
  .orbital-container .week-ring {
    width: 200px;
    height: 200px;
    transform: rotate(180deg); /* Example for mid-week */
  }
  .orbital-container .quarter-ring {
    width: 250px;
    height: 250px;
    transform: rotate(241.2deg); /* 67% of 360 degrees */
  }
  .orbital-container .dot {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: #212529;
    border-radius: 50%;
    top: -5px; /* Adjust for border width */
    left: 50%;
    transform: translateX(-50%);
  }


  /* --- 3) Ledger + Watermark --- */
  .ledger-container {
    position: relative;
    padding: 20px;
    overflow: hidden; /* Keep watermark contained */
  }
  .ledger-container .watermark {
    position: absolute;
    top: -20px;
    left: 10px;
    font-size: 12rem;
    font-weight: 800;
    color: #e9ecef;
    z-index: 1;
    user-select: none;
  }
  .ledger-container .ledger-content {
    position: relative;
    z-index: 2;
  }
  .ledger-container .month-year {
    font-size: 1.2rem;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .ledger-container .ledger-line {
    border-top: 2px solid #000;
    margin: 10px 0;
  }
  .ledger-container .quarter-details,
  .ledger-container .domain-scores-ledger {
    margin-bottom: 10px;
  }
  .ledger-container .domain-scores-ledger {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
  }


  /* --- 4) Quarter Dial --- */
  .dial-outer-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .dial-container {
    position: relative;
    width: 200px;
    height: 100px; /* Half circle height */
  }
  .dial-container svg {
    position: absolute;
    width: 100%;
    height: 100%;
    transform: rotateX(180deg); /* Flip SVG to draw from the bottom up */
  }
  .dial-container .dial-track, .dial-container .dial-fill {
    fill: none;
    stroke-width: 25;
    stroke-linecap: round;
  }
  .dial-container .dial-track {
    stroke: #e9ecef;
  }
  .dial-container .dial-fill {
    stroke: #212529;
    stroke-dasharray: 314; /* Circumference of a 100-radius circle */
    stroke-dashoffset: 103.62; /* 314 * (1 - 0.67) */
  }
  .dial-outer-container .dial-label {
    font-size: 1.5rem;
    font-weight: bold;
  }
  .dial-outer-container .dial-pips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 20px;
    width: 100%;
  }
  .dial-outer-container .pip {
    font-size: 14px;
  }
  .dial-outer-container .date-info {
    font-size: 14px;
    color: #6c757d;
  }

</style>
</head>
<body>

<!-- Concept 1: Quarter Reservoir -->
<div class="concept-container">
  <h2>1. Quarter Reservoir</h2>
  <div class="reservoir-container">
    <div class="ledger-stamp">SEP 24</div>
    <div class="quarter-info">Q3 • 67% • 28 days left</div>
    <div class="quarter-reservoir-wrapper">
      <div class="quarter-reservoir-fill"></div>
    </div>
    <div class="domain-scores">
      <span>Sleep 82 👑</span>
      <span>Fit 77</span>
      <span>Mind 64</span>
      <span>Spirit 85 👑</span>
    </div>
  </div>
</div>

<!-- Concept 2: Orbital Rings -->
<div class="concept-container">
  <h2>2. Orbital Rings</h2>
  <div class="orbital-container">
    <div class="center-label">
      <div>SEP 24</div>
      <div>WK 39 Q3</div>
    </div>
    <div class="ring day-ring"><div class="dot"></div></div>
    <div class="ring week-ring"><div class="dot"></div></div>
    <div class="ring quarter-ring"><div class="dot"></div></div>
  </div>
</div>

<!-- Concept 3: Ledger + Watermark -->
<div class="concept-container">
    <h2>3. Ledger + Watermark</h2>
    <div class="ledger-container">
        <div class="watermark">24</div>
        <div class="ledger-content">
            <div class="month-year">SEPTEMBER 2025</div>
            <div class="ledger-line"></div>
            <div class="quarter-details">Q3 • 67% • 28 left</div>
            <div class="domain-scores-ledger">
            <span>Sleep 82 👑</span>
            <span>Fit 77</span>
            <span>Mind 64</span>
            <span>Spirit 85 👑</span>
            </div>
        </div>
    </div>
</div>


<!-- Concept 4: Quarter Dial -->
<div class="concept-container">
  <h2>4. Quarter Dial</h2>
  <div class="dial-outer-container">
    <div class="dial-label">Q3 67%</div>
    <div class="dial-container">
        <svg viewBox="0 0 100 50">
            <path d="M 5 50 A 45 45 0 0 1 95 50" class="dial-track"></path>
            <path d="M 5 50 A 45 45 0 0 1 95 50" class="dial-fill" style="stroke-dasharray: 141.37; stroke-dashoffset: 46.65;"></path> <!-- 141.37 * (1 - .67) -->
        </svg>
    </div>
    <div class="dial-pips">
      <div class="pip">• Sleep</div>
      <div class="pip">• Fit</div>
      <div class="pip">• Mind</div>
      <div class="pip">• Spirit</div>
    </div>
    <div class="date-info">SEP 24 • WK 39</div>
  </div>
</div>

</body>
</html>
